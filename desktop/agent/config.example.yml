# OmniWork Desktop Agent example config.
#
# Lookup order:
# 1. Explicit path from --config / -c.
# 2. config.yml in the current working directory.
# 3. config.yml next to the running omniwork-agent program.
# 4. config.yml in the desktop/agent package root.
# 5. System global config:
#    - macOS: ~/Library/Application Support/OmniWork/agent/config.yml
#    - Linux: ${XDG_CONFIG_HOME:-~/.config}/omniwork/agent/config.yml
#    - Windows: %APPDATA%/OmniWork/agent/config.yml
#
# Copy this file to one of the lookup locations and name it config.yml.

relay:
  # Required unless relay-device.json already contains a relayUrl.
  url: "wss://relay.company.example/relay/ws/agent"

  # Optional. Defaults to <paths.appSupportDir>/relay-device.json.
  # deviceCredentialsPath: /Users/me/Library/Application Support/OmniWork/agent/relay-device.json

  # Optional. Prefer relay-device.json for persistent device credentials.
  # Use \n escapes if the key is kept on one line.
  # devicePrivateKey: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"

agent:
  # Optional. If omitted, the agent uses relay device credentials, then the
  # local persisted identity file.
  # deviceId: my-desktop

  # Optional. Defaults to hostname without a trailing .local.
  displayName: Alice DesktopBook

  # Optional. Used only when deviceId is omitted.
  # identityPath: /Users/me/.omniwork/agent.json
  # identityIp: 10.0.0.2

  # Default true. Set false only for trusted local debugging.
  requireE2e: true
  # Or use the explicit mode:
  # businessSecurityMode: e2e_required

admin:
  enabled: true
  host: 127.0.0.1
  port: 17668
  # token: local-admin-token

probe:
  enabled: true
  host: 127.0.0.1
  port: 17669
  # token: local-probe-token

pairing:
  # Desktop startup QR validity in seconds. Defaults to 5 minutes.
  qrTtlSeconds: 300

  # Default true. Set false to allow scanning without entering the 4-digit QR password.
  qrPasswordEnabled: true

connection:
  heartbeatMs: 10000
  staleMs: 30000
  disconnectMs: 90000

relayReconnect:
  forever: true
  maxAttempts: 8
  initialDelayMs: 1000
  maxDelayMs: 30000

terminal:
  streamEnabled: false

  size:
    cols: 80
    rows: 24

  # Overrides commands for built-in providers when providers is omitted.
  commands:
    codex: codex
    claude: claude
    gemini: gemini
    traex: traecli

  # Optional. Omit this list to use the built-in provider presets.
  # The plain terminal provider is added automatically when creatable.
  # providers:
  #   - kind: codex
  #     displayName: Codex
  #     command: codex
  #     capability: codex.cli
  #     summary: OpenAI Codex CLI TUI session
  #   - kind: opencode
  #     displayName: OpenCode
  #     command: opencode
  #     capability: opencode.cli
  #     summary: OpenCode CLI TUI session

paths:
  # Defaults to OS-specific application support directory.
  # appSupportDir: /Users/me/Library/Application Support/OmniWork/agent

  # Defaults to the process current working directory.
  # defaultCwd: /Users/me/Code

  # Defaults to files under appSupportDir.
  # sessionKeyPath: /Users/me/Library/Application Support/OmniWork/agent/session-key.json
  # sessionStorePath: /Users/me/Library/Application Support/OmniWork/agent/sessions.sqlite
