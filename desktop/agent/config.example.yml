# OmniWork Desktop Agent example config.
#
# Lookup order:
# 1. Explicit path from --config / -c.
# 2. config.yml in the current working directory.
# 3. config.yml next to the running omniwork-agent program.
# 4. config.yml in the desktop/agent package root.
# 5. System global config:
#    - macOS: ~/Library/Application Support/OmniWork/agent/config.yml
#    - Linux: ${XDG_CONFIG_HOME:-~/.config}/omniwork/agent/config.yml
#    - Windows: %APPDATA%/OmniWork/agent/config.yml
#
# Copy this file to one of the lookup locations and name it config.yml.

relay:
  # Required.
  url: "wss://relay.company.example/relay/ws/agent"

agent:
  # Optional. Defaults to hostname without a trailing .local.
  displayName: Alice DesktopBook

  # Optional. A long-term Ed25519 identity is generated here on first use and
  # reused. The device ID is derived from its public key.
  # identityPath: /Users/me/Library/Application Support/OmniWork/agent/identity-v2.json

appAuthorization:
  # manual (default): approve new App identities in Agent Admin.
  # automatic: trust cryptographically verified App identities immediately.
  mode: manual

admin:
  enabled: true
  host: 127.0.0.1
  port: 17668
  # Required when host is not loopback.
  # token: local-admin-token

probe:
  enabled: true
  host: 127.0.0.1
  port: 17669
  # token: local-probe-token

connection:
  heartbeatMs: 10000
  staleMs: 30000
  disconnectMs: 90000

relayReconnect:
  forever: true
  maxAttempts: 8
  initialDelayMs: 1000
  maxDelayMs: 30000

terminal:
  streamEnabled: false

  size:
    cols: 80
    rows: 24

  # Overrides commands for built-in providers when providers is omitted.
  commands:
    codex: codex
    claude: claude
    gemini: gemini
    traex: traecli

  # Optional. Omit this list to use the built-in provider presets.
  # The plain terminal provider is added automatically when creatable.
  # providers:
  #   - kind: codex
  #     displayName: Codex
  #     command: codex
  #     capability: codex.cli
  #     summary: OpenAI Codex CLI TUI session
  #   - kind: opencode
  #     displayName: OpenCode
  #     command: opencode
  #     capability: opencode.cli
  #     summary: OpenCode CLI TUI session

paths:
  # Defaults to OS-specific application support directory.
  # appSupportDir: /Users/me/Library/Application Support/OmniWork/agent

  # Defaults to the process current working directory.
  # defaultCwd: /Users/me/Code

  # Defaults to files under appSupportDir.
  # probeTokenPath: /Users/me/Library/Application Support/OmniWork/agent/probe-token.json
  # trustedAppsPath: /Users/me/Library/Application Support/OmniWork/agent/trusted-apps-v2.json
  # sessionStorePath: /Users/me/Library/Application Support/OmniWork/agent/sessions.sqlite
